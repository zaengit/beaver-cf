name: Publish Beaver to npmjs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make verify-tag TAG="$RELEASE_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test --if-present

      - name: Verify publishable package
        run: npm pack --dry-run

      - name: Publish to npmjs
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npmjs availability
        run: |
          BEAVER_VERSION=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 30); do
            if npm view "@zaengit/beaver-cf@${BEAVER_VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "@zaengit/beaver-cf@${BEAVER_VERSION} is available on npmjs"
              exit 0
            fi
            echo "Waiting for @zaengit/beaver-cf@${BEAVER_VERSION} on npmjs (${attempt}/30)"
            sleep 10
          done
          echo "@zaengit/beaver-cf@${BEAVER_VERSION} was not available on npmjs after 5 minutes" >&2
          exit 1
